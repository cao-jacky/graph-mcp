# Stage 0 — Neo4j for the knowledge graph.
#
# Merge this service into an existing compose stack, or run it standalone:
#   docker compose -f docker-compose.neo4j.yml up -d
#
# Binding note. If graph-mcp runs on the SAME host as Neo4j, drop the `ports:`
# section entirely and let it reach Bolt over the compose network — nothing
# needs publishing at all. Publish Bolt only when graph-mcp runs elsewhere
# (for example, on the machine hosting the embedding model), and then bind it
# to a private interface — a VPN/WireGuard/Tailscale address, or a LAN address
# — never 0.0.0.0. Neo4j Browser stays on localhost; tunnel to it if needed.
#
# Replace <BOLT_BIND_ADDR> below with that private address.

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      # Set NEO4J_PASSWORD in the stack's .env — never inline it here.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      # 4096-dim vectors are large; this keeps the transaction that writes
      # a full corpus of chunk embeddings from tripping the default limit.
      NEO4J_db_memory_transaction_total_max: 1G
    ports:
      - "<BOLT_BIND_ADDR>:7687:7687"   # Bolt — private interface only
      - "127.0.0.1:7474:7474"          # Browser — localhost only
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    # Set equal to mem_limit: without it the container spills into host swap
    # instead of OOM-killing inside its own cgroup.
    memswap_limit: 4g

volumes:
  neo4j-data:
  neo4j-logs:
