# Neo4j for graph-mcp — deployable as-is via Portainer (Stacks → Add stack →
# Repository) or `docker compose up -d`.
#
# By default this starts Neo4j only. Desktop MCP clients spawn `graph-mcp`
# themselves over stdio and need nothing else here.
#
# The optional `graph-mcp` service (profile: server) serves MCP over HTTP for
# clients that CANNOT spawn a local process — an agent in another container.
# Enable it with `--profile server`, or COMPOSE_PROFILES=server in Portainer.
#
# `graph-sync` is a batch job, not a service: it needs the markdown corpus and
# an embedding endpoint, so it runs wherever the embedding model is.
#
# Required environment variable (set it in Portainer's stack env editor, or in
# a .env beside this file):
#
#   NEO4J_PASSWORD   database password for the `neo4j` user
#
# Optional:
#
#   BOLT_BIND_ADDR   interface to publish Bolt on. Defaults to 127.0.0.1,
#                    which is correct when graph-sync/graph-mcp run on this
#                    same host. If they run elsewhere, set this to a PRIVATE
#                    address — a VPN/WireGuard/Tailscale address or a LAN
#                    address. Never 0.0.0.0: Bolt would then be exposed to
#                    every network this host can reach.
#   BROWSER_BIND_ADDR  interface for the Neo4j Browser UI. Defaults to
#                    127.0.0.1; tunnel to it rather than publishing it. Note
#                    this is INDEPENDENT of BOLT_BIND_ADDR — setting one does
#                    not publish the other, which matters when tunnelling.
#   NEO4J_MEM_LIMIT  container memory ceiling, default 4g. Must cover heap +
#                    pagecache + JVM overhead + Lucene's off-heap use. The
#                    default is marginal for a full embedding pass over
#                    4096-dim vectors; use 8g or more for vector workloads, or
#                    the container is OOM-killed mid-run and restarted.
#   NEO4J_IMAGE      defaults to neo4j:5-community.
#
# Community Edition has exactly one user and one database, both named `neo4j`.
# Additional users/databases are Enterprise-only.

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the stack environment}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # 4096-dim vectors are large; this keeps the transaction that writes a
      # full corpus of chunk embeddings from tripping the default limit.
      NEO4J_db_memory_transaction_total_max: ${NEO4J_TX_MAX:-1G}
    ports:
      - "${BOLT_BIND_ADDR:-127.0.0.1}:7687:7687"
      - "${BROWSER_BIND_ADDR:-127.0.0.1}:7474:7474"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NEO4J_MEM_LIMIT:-4g}
    # Equal to mem_limit on purpose: without it the container spills into host
    # swap instead of OOM-killing inside its own cgroup.
    memswap_limit: ${NEO4J_MEM_LIMIT:-4g}

  # Optional: graph-mcp over HTTP, for MCP clients that cannot spawn a local
  # stdio process (Hermes Agent in a sibling container, for example). Desktop
  # clients should keep using stdio and do not need this.
  #
  #   docker compose --profile server up -d
  #
  # Required alongside the Neo4j variables:
  #   GRAPH_MCP_AUTH_TOKEN   shared bearer token (`openssl rand -hex 32`)
  #   EMBED_BASE_URL         embedding endpoint reachable FROM this container
  #                          — not 127.0.0.1 unless the model runs here too
  #   AGENT_NETWORK          the MCP client's Docker network, if it is in
  #                          another stack
  #
  # The corpus is deliberately NOT mounted: every tool queries Neo4j and none
  # read files. Only graph-sync needs the notes, and it runs wherever the
  # embedding model is.
  graph-mcp:
    profiles: ["server"]
    build: .
    image: graph-mcp:local
    # This image is built here, not published to a registry. Without an
    # explicit build policy, `docker compose pull` — which Portainer runs
    # before deploying a stack — tries to fetch `graph-mcp:local` from Docker
    # Hub and fails with "pull access denied".
    pull_policy: build
    container_name: graph-mcp
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      GRAPH_MCP_TRANSPORT: streamable-http
      GRAPH_MCP_HTTP_HOST: 0.0.0.0
      GRAPH_MCP_HTTP_PORT: 8000
      # Deliberately NOT marked required with `:?`. Compose interpolates the
      # whole file before profiles are applied, so a required variable here
      # would break `docker compose up` for the default (neo4j-only) stack.
      # The server refuses to start without a token instead.
      GRAPH_MCP_AUTH_TOKEN: "${GRAPH_MCP_AUTH_TOKEN:-}"
      # Host header allowlist for the SDK's DNS-rebinding protection. Empty
      # disables the check; `*` is not a wildcard, see the README.
      GRAPH_MCP_ALLOWED_HOSTS: "${GRAPH_MCP_ALLOWED_HOSTS:-}"
      # Reached over the compose network, so no port needs publishing.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      NEO4J_DATABASE: neo4j
      GRAPH_MCP_EMBED_BASE_URL: "${EMBED_BASE_URL:-http://127.0.0.1:1234/v1}"
      GRAPH_MCP_EMBED_MODEL: "${EMBED_MODEL:-text-embedding-qwen3-embedding-8b}"
      GRAPH_MCP_EMBED_DIM: "${EMBED_DIM:-4096}"
      # Stage gate: leave unset until the semantic pass has been validated.
      GRAPH_MCP_SEMANTIC_TOOLS: "${GRAPH_MCP_SEMANTIC_TOOLS:-}"
    ports:
      # Leave unpublished if the client is a sibling container — it can reach
      # http://graph-mcp:8000/mcp over the compose network without this.
      - "${MCP_BIND_ADDR:-127.0.0.1}:8000:8000"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MCP_MEM_LIMIT:-1g}
    memswap_limit: ${MCP_MEM_LIMIT:-1g}
    networks:
      # `default` reaches Neo4j; `agent` is the network the MCP client lives
      # on. Docker's embedded DNS only resolves service names within a shared
      # user-defined network, so a client in another stack cannot resolve
      # `graph-mcp` at all until both sides share one.
      - default
      - agent

networks:
  default:
  # The MCP client's network. To join one that already exists — so the
  # client's container is never modified or recreated — set BOTH:
  #
  #   AGENT_NETWORK=hermes_hermes-net
  #   AGENT_NETWORK_EXTERNAL=true
  #
  # Find the name with:
  #   docker inspect -f '{{range $$k,$$v := .NetworkSettings.Networks}}{{$$k}} {{end}}' <client>
  # Note it is the *Docker* network name (project-prefixed), not the key used
  # in the client's compose file.
  #
  # Left unset, the stack creates its own private network and nothing else
  # joins it. It must not default to `bridge`: the default bridge is not
  # user-defined, and attaching to it fails with "network-scoped aliases are
  # only supported for user-defined networks".
  agent:
    name: ${AGENT_NETWORK:-graph-mcp_agent}
    external: ${AGENT_NETWORK_EXTERNAL:-false}

volumes:
  neo4j-data:
  neo4j-logs:
